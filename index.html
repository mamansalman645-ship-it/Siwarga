<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>SIWARGA RT 03 / RW 02 — Desa Babakansari</title>
<meta name="description" content="Sistem pendataan warga RT 03 RW 02 Desa Babakansari, Kecamatan Sukaluyu, Kabupaten Cianjur.">
<style>
  :root{
    --bg:#f2f6f5; --card:#fff; --ink:#0d2b29; --muted:#64748b;
    --line:#e3eae8; --brand:#0f766e; --brand2:#14b8a6;
    --accent:#f59e0b; --danger:#dc2626; --ok:#16a34a;
    --radius:18px; --shadow:0 6px 22px rgba(13,43,41,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--ink);padding-bottom:110px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit}

  /* ============================================================
     LOGIN SCREEN
     ============================================================ */
  .login-overlay{
    position:fixed;inset:0;z-index:9999;
    background:linear-gradient(160deg,#0f766e 0%,#14b8a6 55%,#5eead4 100%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  .login-overlay.hide{display:none}
  .login-overlay::before{
    content:"";position:absolute;top:-100px;right:-100px;
    width:320px;height:320px;border-radius:50%;
    background:rgba(255,255,255,.08);pointer-events:none;
  }
  .login-overlay::after{
    content:"";position:absolute;bottom:-120px;left:-120px;
    width:360px;height:360px;border-radius:50%;
    background:rgba(255,255,255,.06);pointer-events:none;
  }
  .login-card{
    position:relative;background:#fff;border-radius:28px;
    padding:32px 26px 26px;max-width:390px;width:100%;
    box-shadow:0 30px 70px rgba(0,0,0,.28);
    animation:loginIn .55s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes loginIn{
    from{opacity:0;transform:translateY(24px) scale(.94)}
    to{opacity:1;transform:none}
  }
  .login-logo{
    width:132px;height:132px;margin:0 auto 20px;display:block;
    filter:drop-shadow(0 8px 18px rgba(15,118,110,.28));
  }
  .login-welcome{
    text-align:center;font-size:20px;font-weight:900;
    letter-spacing:3.5px;color:#0f766e;margin-bottom:10px;
    line-height:1.2;
  }
  .login-welcome-line{
    width:52px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#0f766e,#14b8a6);
    margin:0 auto 14px;
  }
  .login-sub{
    text-align:center;font-size:12px;color:#64748b;
    line-height:1.6;margin-bottom:24px;font-weight:600;
  }
  .login-sub b{color:#0f766e;font-weight:800;display:inline-block;margin-top:3px}
  .login-field{margin-bottom:11px;position:relative}
  .login-field label{
    display:block;font-size:10.5px;font-weight:800;color:#64748b;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;
  }
  .login-field input{
    width:100%;padding:14px 46px 14px 15px;border-radius:13px;
    border:1.5px solid #e3eae8;background:#f8fbfa;
    font-size:14px;font-family:inherit;color:#0d2b29;outline:none;
    transition:.15s;
  }
  .login-field input:focus{
    border-color:#14b8a6;background:#fff;
    box-shadow:0 0 0 3px rgba(20,184,166,.15);
  }
  .login-field input.err{border-color:#dc2626;background:#fef2f2}
  .login-eye{
    position:absolute;right:8px;bottom:8px;
    width:34px;height:34px;border:0;background:none;
    font-size:17px;cursor:pointer;color:#94a3b8;
    display:grid;place-items:center;border-radius:9px;
    transition:.15s;
  }
  .login-eye:active{background:#eef3f2}
  .login-msg{
    font-size:12px;font-weight:700;color:#dc2626;
    margin:2px 0 10px;text-align:center;min-height:16px;line-height:1.4;
  }
  .login-btn{
    width:100%;padding:15px;border-radius:14px;border:0;
    background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;
    font-size:14.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;
    box-shadow:0 8px 20px rgba(15,118,110,.35);
    transition:transform .15s;margin-top:4px;
  }
  .login-btn:active{transform:scale(.97)}
  .login-foot{
    text-align:center;font-size:10.5px;color:#94a3b8;
    margin-top:16px;line-height:1.6;font-weight:600;
  }
  .login-foot .lnk{color:#0f766e;font-weight:800;text-decoration:underline;cursor:pointer}
  .login-hint{
    font-size:11px;color:#78500a;margin-top:14px;padding:11px 13px;
    background:#fff8e6;border:1px solid #fde68a;border-radius:11px;
    line-height:1.5;
  }
  .login-hint b{color:#92400e}

  /* HEADER */
  header{
    background:linear-gradient(135deg,#0f766e 0%,#14b8a6 100%);
    color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;
    box-shadow:0 6px 20px rgba(15,118,110,.28);
    border-radius:0 0 22px 22px;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-size:20px;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25)
  }
  .brand .tt{flex:1;min-width:0}
  .brand h1{font-size:15.5px;font-weight:800;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:11px;opacity:.9;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbadge{
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
    padding:7px 11px;border-radius:12px;font-size:10.5px;font-weight:800;
    text-align:center;line-height:1.15;flex:0 0 auto;
  }
  .hbadge b{display:block;font-size:15px}

  /* LAYOUT */
  main{padding:16px;max-width:780px;margin:0 auto}
  .page{display:none}
  .page.active{display:block;animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;
  }
  .section-title{
    font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
    color:var(--muted);margin:18px 4px 10px;
  }
  .section-title:first-child{margin-top:0}

  /* ============================================================
     RUNNING TEXT — Kartu sambutan Beranda
     ============================================================ */
  .greet-card{
    background:linear-gradient(135deg,#0f766e,#14b8a6);
    border:0;color:#fff;margin-bottom:14px;
    overflow:hidden;position:relative;
  }
  .greet-card::after{
    content:"";position:absolute;width:180px;height:180px;
    border-radius:50%;background:rgba(255,255,255,.08);
    right:-70px;top:-80px;pointer-events:none;
  }
  .greet-label{
    font-size:9.5px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;opacity:.75;
    display:flex;align-items:center;gap:6px;margin-bottom:10px;
    position:relative;z-index:1;
  }
  .greet-live{
    display:inline-flex;align-items:center;gap:4px;
  }
  .greet-live::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:#fbbf24;box-shadow:0 0 0 0 rgba(251,191,36,.6);
    animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(251,191,36,.7)}
    100%{box-shadow:0 0 0 8px rgba(251,191,36,0)}
  }

  .marquee{
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    padding:6px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);
    z-index:1;
  }
  .marquee-track{
    display:inline-block;
    padding-left:100%;
    animation:greetScroll 24s linear infinite;
    will-change:transform;
  }
  @keyframes greetScroll{
    0%{transform:translateX(0)}
    100%{transform:translateX(-100%)}
  }
  .marquee-track .h2{
    display:inline-block;
    font-size:18px;
    font-weight:800;
    letter-spacing:.4px;
    line-height:1.3;
    white-space:nowrap;
  }
  .marquee-track .sep{
    display:inline-block;
    margin:0 18px;
    opacity:.5;
    font-weight:400;
  }
  .greet-date{
    font-size:11px;
    opacity:.9;
    margin-top:6px;
    font-weight:600;
    position:relative;z-index:1;
    display:flex;align-items:center;gap:6px;
  }

  /* WILAYAH BANNER */
  .wilayah{
    display:flex;gap:12px;align-items:center;padding:13px 15px;
    background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;
    border-radius:16px;margin-bottom:14px;
    box-shadow:0 8px 22px rgba(15,118,110,.25);
  }
  .wilayah .wi{font-size:20px;flex:0 0 auto}
  .wilayah .wt{flex:1;min-width:0}
  .wilayah .wt b{display:block;font-size:13px;font-weight:800;margin-bottom:2px}
  .wilayah .wt span{font-size:10.5px;opacity:.9;font-weight:600}

  .search{
    width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);font-size:14px;outline:none;box-shadow:var(--shadow);
    margin-bottom:12px;color:var(--ink);
  }
  .search:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 13px;border-radius:18px;border:1px solid var(--line);
    background:var(--card);font-size:11.5px;font-weight:800;color:var(--muted);
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(15,118,110,.3)}

  .avatar{
    width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
    font-size:16px;font-weight:800;color:#fff;flex:0 0 auto;
  }
  .avatar.L{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .avatar.P{background:linear-gradient(135deg,#db2777,#ec4899)}

  .warga-card{
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .15s;
  }
  .warga-card:active{transform:scale(.985)}
  .warga-card .top{display:flex;gap:11px;align-items:center;margin-bottom:8px}
  .warga-card .wav{
    width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
    color:#fff;font-size:16px;font-weight:800;flex:0 0 auto;position:relative;
  }
  .warga-card .wav.L{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .warga-card .wav.P{background:linear-gradient(135deg,#db2777,#ec4899)}
  .warga-card .wav .head-star{
    position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;
    background:#f59e0b;border:2px solid #fff;border-radius:50%;
    display:grid;place-items:center;font-size:9px;
  }
  .warga-card .wt{flex:1;min-width:0}
  .warga-card .wt b{display:block;font-size:13px;font-weight:700;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .warga-card .wt small{font-size:10.5px;color:var(--muted);font-weight:600}
  .warga-card .age{
    background:#f1f5f4;padding:6px 9px;border-radius:10px;
    font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;
    line-height:1.2;flex:0 0 auto;
  }
  .warga-card .age b{display:block;font-size:15px;color:var(--brand)}
  .warga-card .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .warga-card .badge{
    font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:7px;
    letter-spacing:.2px;
  }
  .badge.head{background:#fef3c7;color:#92400e}
  .badge.hp{background:#dcfce7;color:#15803d}
  .badge.alamat{background:#e0e7ff;color:#3730a3}
  .warga-card .completeness{
    display:flex;align-items:center;gap:6px;font-size:10px;
    color:var(--muted);font-weight:700;
  }
  .warga-card .completeness .dots{display:flex;gap:3px}
  .warga-card .completeness .d{
    width:7px;height:7px;border-radius:50%;background:#d6e0de;
  }
  .warga-card .completeness .d.on{background:var(--brand2)}
  .warga-card .completeness .pct{margin-left:auto;color:var(--brand);font-weight:800}

  .kk-card{
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:13px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .15s;
  }
  .kk-card:active{transform:scale(.985)}
  .kk-card .head{display:flex;gap:11px;align-items:center;margin-bottom:9px}
  .kk-card .kav{
    width:42px;height:42px;border-radius:12px;background:#e6f4f1;
    display:grid;place-items:center;font-size:20px;flex:0 0 auto;
  }
  .kk-card .kt{flex:1;min-width:0}
  .kk-card .kt b{display:block;font-size:13px;font-weight:800;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kk-card .kt small{font-size:10px;color:var(--muted);font-weight:600}
  .kk-card .cnt{
    background:#e6f4f1;color:#0f766e;padding:6px 10px;border-radius:9px;
    font-size:10.5px;font-weight:800;flex:0 0 auto;
  }
  .kk-card .addr{font-size:11px;color:var(--muted);margin-bottom:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kk-card .avatars{display:flex;gap:4px;align-items:center}
  .kk-card .mini-av{
    width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
    font-size:10.5px;font-weight:800;color:#fff;
  }
  .kk-card .mini-av.L{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .kk-card .mini-av.P{background:linear-gradient(135deg,#db2777,#ec4899)}
  .kk-card .more{
    font-size:10px;font-weight:800;color:var(--muted);
    background:#f1f5f4;padding:5px 8px;border-radius:8px;
  }
  .kk-card .go{margin-left:auto;font-size:16px;color:#c8d6d3}

  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat{
    background:var(--card);border-radius:16px;padding:13px 14px;
    border:1px solid var(--line);box-shadow:var(--shadow);
    position:relative;overflow:hidden;cursor:pointer;
    transition:transform .15s;
  }
  .stat:active{transform:scale(.97)}
  .stat .lb{font-size:10px;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .stat .vl{font-size:24px;font-weight:800;line-height:1}
  .stat .sb{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600}
  .stat .arrow{position:absolute;right:10px;top:10px;font-size:14px;color:#c8d6d3}

  .aksi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
  .aksi .a{
    background:var(--card);border-radius:14px;padding:13px 4px;text-align:center;
    border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;
    transition:transform .15s;
  }
  .aksi .a:active{transform:scale(.94)}
  .aksi .a .ic{font-size:22px;display:block;margin-bottom:5px}
  .aksi .a .lbl{font-size:10px;font-weight:800;color:var(--muted);line-height:1.2}

  .alert{
    display:flex;gap:10px;align-items:flex-start;padding:11px 13px;
    background:#fff8e6;border:1px solid #fde68a;border-radius:13px;
    margin-bottom:9px;font-size:12px;line-height:1.5;color:#78500a;
  }
  .alert.danger{background:#fdecec;border-color:#fecaca;color:#991b1b}
  .alert.info{background:#e6f4f1;border-color:#b8e0d8;color:#0f766e}
  .alert .ai{font-size:15px;flex:0 0 auto;line-height:1.2}

  .mini-chart{
    background:var(--card);border-radius:15px;padding:13px 14px;
    border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:13px;
  }
  .mini-chart .ttl{
    font-size:10.5px;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px;
  }
  .donut-wrap{display:flex;align-items:center;gap:15px}
  .donut{
    width:72px;height:72px;border-radius:50%;position:relative;flex:0 0 auto;
    background:conic-gradient(#3b82f6 0deg 180deg, #ec4899 180deg 360deg);
  }
  .donut::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
  .donut-lbl{position:absolute;inset:0;display:grid;place-items:center;
    font-size:13px;font-weight:800;z-index:1}
  .donut-info{flex:1;font-size:12px;line-height:1.8}
  .donut-info .row{display:flex;align-items:center;gap:7px;font-weight:700}
  .donut-info .dot{width:9px;height:9px;border-radius:50%}

  .aktivitas{
    background:var(--card);border-radius:15px;padding:13px 14px;
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .aktivitas .ttl{
    font-size:10.5px;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
  }
  .akt-item{display:flex;gap:10px;align-items:center;padding:9px 0;
    border-bottom:1px solid #f0f5f4;font-size:12px;cursor:pointer}
  .akt-item:last-child{border-bottom:0;padding-bottom:0}
  .akt-item .av{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#fff;flex:0 0 auto;
  }
  .akt-item .av.L{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .akt-item .av.P{background:linear-gradient(135deg,#db2777,#ec4899)}
  .akt-item .txt{flex:1;min-width:0}
  .akt-item .txt b{font-weight:700;font-size:12px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .akt-item .txt div{color:var(--muted);font-size:10.5px;margin-top:1px}
  .akt-item .time{font-size:10px;color:#94a3b8;font-weight:700;flex:0 0 auto}

  .empty{text-align:center;padding:44px 16px;color:var(--muted);font-size:13px;line-height:1.6}
  .empty div:first-child{font-size:44px;margin-bottom:12px;opacity:.5}

  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:11px;font-weight:800;color:var(--muted);
    margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase;
  }
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;font-size:14px;font-family:inherit;color:var(--ink);
    outline:none;transition:.15s;
  }
  .field textarea{resize:vertical;min-height:70px}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,184,166,.13);
  }
  .field input.err,.field select.err{border-color:var(--danger);background:#fef2f2}
  .field input:read-only{background:#f1f5f4;color:#475569;cursor:not-allowed}
  .hint{font-size:10.5px;color:#94a3b8;margin-top:5px;line-height:1.45}
  .errmsg{font-size:11px;color:var(--danger);margin-top:5px;font-weight:800;display:none}
  .field.haserr .errmsg{display:block}
  .pills{display:flex;gap:8px}
  .pills button{
    flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
    transition:.15s;
  }
  .pills button.on{background:#e6f4f1;border-color:var(--brand);color:var(--brand)}

  .locked{
    padding:12px 14px;border-radius:12px;background:#e6f4f1;
    border:1.5px solid #b8e0d8;font-size:13.5px;font-weight:800;color:#0f766e;
    display:flex;align-items:center;gap:8px;
  }

  .kk-info{
    background:#f8fbfa;border:1px solid #e1eae8;border-radius:12px;
    padding:11px 13px;margin-bottom:14px;
  }
  .kk-info-head{
    display:flex;justify-content:space-between;font-size:11.5px;
    font-weight:800;color:#0f766e;margin-bottom:8px;gap:10px;
  }

const firebaseConfig = {

function togglePw(id, btn){
  const inp=document.getElementById(id); if(!inp) return;
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁';}
}
function pesanAuth(err){
  const map={'auth/email-already-in-use':'Email sudah terdaftar. Silakan masuk.','auth/invalid-email':'Format email tidak valid.','auth/weak-password':'Kata sandi minimal 6 karakter.','auth/invalid-credential':'Email atau kata sandi salah.','auth/user-not-found':'Akun tidak ditemukan.','auth/wrong-password':'Kata sandi salah.','auth/network-request-failed':'Koneksi internet bermasalah.'};
  return map[err.code]||('Gagal: '+(err.message||'silakan coba lagi'));
}
function tampilLogin(){
  document.getElementById('loginLogin').style.display='block';
  const f=document.getElementById('loginFoot');
  if(f) f.textContent='SIWARGA RT · Login Firebase';
}
async function ambilDataCloud(){
  const u=auth.currentUser;if(!u)throw new Error('Belum login.');
  const ref=collection(firestore,'pengurus',u.uid,'warga');const snap=await getDocs(ref);
  return snap.docs.map(x=>({...x.data(),id:x.id}));
}
async function simpanDataCloud(){
  const u=auth.currentUser;if(!u||!cloudReady)return;
  const ref=collection(firestore,'pengurus',u.uid,'warga');const snap=await getDocs(ref);
  const wanted=new Set(DB.map(x=>String(x.id)));const ops=[];
  DB.forEach(x=>ops.push({type:'set',id:String(x.id),data:x}));
  snap.docs.forEach(x=>{if(!wanted.has(x.id))ops.push({type:'delete',id:x.id});});
  for(let i=0;i<ops.length;i+=450){const batch=writeBatch(firestore);ops.slice(i,i+450).forEach(op=>{const target=doc(firestore,'pengurus',u.uid,'warga',op.id);if(op.type==='set')batch.set(target,op.data);else batch.delete(target);});await batch.commit();}
}
async function muatDataSetelahLogin(){
  cloudReady=false;const lokal=ls.get(KEY,[]);const online=await ambilDataCloud();
  if(online.length){DB=online.filter(cocokLokasi).map(d=>({...d,rt:LOKASI.rt,rw:LOKASI.rw}));}
  else{DB=Array.isArray(lokal)?lokal.filter(cocokLokasi).map(d=>({...d,rt:LOKASI.rt,rw:LOKASI.rw})):[];}
  localStorage.setItem(KEY,JSON.stringify(DB));cloudReady=true;
  if(!online.length&&DB.length)await simpanDataCloud();
  render();
}
function initLogin(){
  const overlay=document.getElementById('loginScreen');
  document.querySelectorAll('[data-eye]').forEach(btn=>btn.onclick=()=>togglePw(btn.dataset.eye,btn));

  document.body.style.overflow='hidden';

    if(!email||!pw){msg.textContent='Masukkan email dan kata sandi.';return;}
    try{
      await signInWithEmailAndPassword(auth,email,pw);
    }catch(e){
      msg.textContent=pesanAuth(e);
    }
  };

  onAuthStateChanged(auth,async user=>{
    if(!user){
      cloudReady=false;
      overlay.classList.remove('hide');
      document.body.style.overflow='hidden';
      return;
    }
    try{
      await muatDataSetelahLogin();
      overlay.classList.add('hide');
      document.body.style.overflow='';
      toast('Berhasil masuk ke SIWARGA.');
    }catch(e){
      cloudReady=false;
      overlay.classList.remove('hide');
      document.body.style.overflow='hidden';
      document.getElementById('loginMsg').textContent='Gagal memuat database online: '+e.message;
    }
  });
}

const LABEL_WILAYAH = 'RT ' + LOKASI.rt + ' / RW ' + LOKASI.rw + ' — ' + LOKASI.desa + ', Kec. ' + LOKASI.kecamatan + ', Kab. ' + LOKASI.kabupaten;

/* =========================================================

const AGAMA = ['Islam','Kristen','Katolik','Hindu','Buddha','Konghucu','Lainnya'];

/* =========================================================

let DB = [];
let halaman = 'beranda';
let prevPage = 'beranda';
let editId = null;
let prefillKK = '';
let cariWarga = '';
let filterWarga = 'semua';
let cariKK = '';
let sortKK = 'nama';

const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

function cocokLokasi(d){
  // Data lama tanpa kolom RT/RW dianggap berasal dari wilayah aplikasi ini.
  const rt = d.rt == null || d.rt === '' ? LOKASI.rt : d.rt;
  const rw = d.rw == null || d.rw === '' ? LOKASI.rw : d.rw;
  return parseInt(rt,10) === parseInt(LOKASI.rt,10) &&
         parseInt(rw,10) === parseInt(LOKASI.rw,10);
}

function muat(){
  DB=ls.get(KEY,[]);if(!Array.isArray(DB))DB=[];
  DB=DB.filter(cocokLokasi).map(d=>({...d,rt:LOKASI.rt,rw:LOKASI.rw}));
}
function simpanDB(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));if(cloudReady){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{try{await simpanDataCloud();toast('Data tersimpan di perangkat dan Firebase.');}catch(e){toast('Tersimpan lokal, sinkronisasi cloud gagal. Periksa internet.');console.error(e);}},500);}return true;}
  catch(e){toast('Penyimpanan gagal. Memori perangkat mungkin penuh. Segera ekspor cadangan.');return false;}
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* =========================================================
   UTIL
   ========================================================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function umur(tgl){
  if(!tgl) return null;
  const b = new Date(tgl + 'T00:00:00');
  if(isNaN(b)) return null;
  const n = new Date();
  let u = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && n.getDate() < b.getDate())) u--;
  return (u >= 0 && u < 130) ? u : null;
}

function tglID(tgl){
  if(!tgl) return '-';
  const d = new Date(tgl + 'T00:00:00');
  if(isNaN(d)) return tgl;
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return d.getDate() + ' ' + bln[d.getMonth()] + ' ' + d.getFullYear();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 2400);
}

function greeting(){
  const j = new Date().getHours();
  if(j < 11) return 'Selamat pagi';
  if(j < 15) return 'Selamat siang';
  if(j < 18) return 'Selamat sore';
  return 'Selamat malam';
}

function greetingEmoji(){
  const j = new Date().getHours();
  if(j < 11) return '🌅';
  if(j < 15) return '☀️';
  if(j < 18) return '🌤️';
  return '🌙';
}

function tglSekarang(){
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date();
  return hari[d.getDay()] + ', ' + d.getDate() + ' ' + bln[d.getMonth()] + ' ' + d.getFullYear();
}

function timeAgo(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  if(diff < 0) return 'Baru saja';
  const mins = Math.floor(diff / 60000);
  if(mins < 1) return 'Baru saja';
  if(mins < 60) return mins + ' menit lalu';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + ' jam lalu';
  const days = Math.floor(hrs / 24);
  if(days === 1) return 'Kemarin';
  if(days < 7) return days + ' hari lalu';
  const d = new Date(iso);
  return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
}

function getKKGroups(){
  const map = {};
  DB.forEach(d => {
    const kk = (d.kk || '').trim();
    if(!kk) return;
    if(!map[kk]) map[kk] = { no: kk, anggota: [], alamat: '', lastUpdate: '' };
    map[kk].anggota.push(d);
    if(!map[kk].alamat && d.alamat) map[kk].alamat = d.alamat;
    const t = d.diubah || d.dibuat || '';
    if(t > map[kk].lastUpdate) map[kk].lastUpdate = t;
  });
  const arr = Object.values(map);
  arr.forEach(g => { g.kepala = kepalaPerkiraan(g.anggota); });
  return arr;
}

function kepalaPerkiraan(anggota){
  const ditetapkan = anggota.find(d => d.peranKK === 'Kepala Keluarga');
  if(ditetapkan) return ditetapkan;
  let best = null, bestUsia = -1;
  anggota.forEach(d => {
    const u = umur(d.tglLahir);
    const v = u === null ? 0 : u;
    if(v > bestUsia){ bestUsia = v; best = d; }
  });
  return best || anggota[0] || null;
}

function kelengkapan(d){
  const cek = [
    d.nik && d.nik.length === 16,
    d.kk && d.kk.length === 16,
    d.alamat && d.alamat.trim().length > 0,
    d.hp && d.hp.trim().length > 0,
    d.pekerjaan && d.pekerjaan.trim().length > 0
  ];
  const filled = cek.filter(Boolean).length;
  return { filled, total: 5, pct: Math.round(filled/5*100) };
}

   NAVIGASI
   ========================================================= */
function go(p){
  if(p !== 'form'){ prefillKK = ''; }
  prevPage = halaman === 'form' && p === 'form' ? prevPage : halaman;
  halaman = p;
  document.querySelectorAll('.page').forEach(el=>{
    el.classList.toggle('active', el.id === 'page-' + p);
  });
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav === p);
  });
  updateHeaderInfo();
  updateFAB();
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

document.querySelectorAll('nav.bottom button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(b.dataset.nav === 'form') editId = null;
    go(b.dataset.nav);
  });
});

document.getElementById('fab').addEventListener('click', ()=>{
  editId = null;
  prefillKK = '';
  go('form');
});

function updateHeaderInfo(){
  const info = HEADER_INFO[halaman] || HEADER_INFO.beranda;
  document.getElementById('headerIcon').textContent = info.icon;
  document.getElementById('headerTitle').textContent = info.title;
  const sub = halaman === 'beranda' ? tglSekarang()
    : halaman === 'warga' ? DB.length + ' jiwa · ' + LABEL_WILAYAH
    : halaman === 'kk' ? getKKGroups().length + ' KK terdata'
    : info.sub || LABEL_WILAYAH;
  document.getElementById('headerSub').textContent = sub;
  document.getElementById('totalBadge').textContent = DB.length;
}

function updateFAB(){
  const fab = document.getElementById('fab');
  const show = ['beranda','warga','kk','stat'].includes(halaman);
  fab.classList.toggle('hide', !show);
}

function render(){
  updateHeaderInfo();
  updateFAB();
  if(halaman === 'beranda') renderBeranda();
  else if(halaman === 'warga') renderWarga();
  else if(halaman === 'kk') renderKK();
  else if(halaman === 'stat') renderStat();
  else if(halaman === 'form') renderForm();
  else if(halaman === 'lain') renderLain();
}

function buildAlerts(){
  const alerts = [];
  const tanpaHP = DB.filter(d => !d.hp || !d.hp.trim()).length;
  if(tanpaHP > 0){
    alerts.push({type:'', icon:'📱', text:`<b>${tanpaHP} warga belum isi No. HP.</b> Lengkapi agar mudah dihubungi.`});
  }
  const tanpaAlamat = DB.filter(d => !d.alamat || !d.alamat.trim()).length;
  if(tanpaAlamat > 0){
    alerts.push({type:'', icon:'📍', text:`<b>${tanpaAlamat} warga belum isi alamat.</b>`});
  }
  const tanpaKK = DB.filter(d => !d.kk || !d.kk.trim()).length;
  if(tanpaKK > 0){
    alerts.push({type:'danger', icon:'⚠️', text:`<b>${tanpaKK} warga belum terkait KK.</b>`});
  }
  const now = new Date();
  const ultah = DB.filter(d => {
    if(!d.tglLahir) return false;
    const t = new Date(d.tglLahir + 'T00:00:00');
    return !isNaN(t) && t.getMonth() === now.getMonth();
  });
  if(ultah.length > 0){
    const names = ultah.slice(0,3).map(d=>d.nama).filter(Boolean).join(', ');
    alerts.push({type:'info', icon:'🎂', text:`<b>${ultah.length} warga berulang tahun bulan ini.</b> ${esc(names)}${ultah.length>3?' dll.':''}`});
  }
  return alerts;
}

function getRecentActivity(limit){
  return DB.map(d => ({
    d,
    time: d.diubah || d.dibuat || '',
    type: d.diubah ? 'edit' : 'add'
  }))
  .filter(x => x.time)
  .sort((a,b) => new Date(b.time) - new Date(a.time))
  .slice(0, limit);
}

function simpanForm(el, jkVal){
  const v = id => el.querySelector('#f_'+id).value.trim();
  const data = {
    nik: v('nik'), kk: v('kk'), nama: v('nama'), jk: jkVal, peranKK: v('peranKK'),
    tglLahir: v('tglLahir'), agama: v('agama'), statusKawin: v('statusKawin'),
    pendidikan: v('pendidikan'), pekerjaan: v('pekerjaan'), alamat: v('alamat'),
    rt: LOKASI.rt, rw: LOKASI.rw, hunian: v('hunian'), hp: v('hp'), catatan: v('catatan')
  };

  let ok = true;
  const setErr = (wrapId, val) => {
    const w = el.querySelector('#'+wrapId);
    if(!w) return;
    w.classList.toggle('haserr', !val);
    const inp = w.querySelector('input,select,textarea');
    if(inp) inp.classList.toggle('err', !val);
    if(!val) ok = false;
  };

  setErr('w_nik', /^\d{16}$/.test(data.nik) && !DB.some(x=>x.nik===data.nik && x.id!==editId));
  setErr('w_kk', data.kk === '' || /^\d{16}$/.test(data.kk));
  setErr('w_nama', data.nama.length > 0);
  setErr('w_tgl', !!data.tglLahir && umur(data.tglLahir) !== null);

  if(!ok){
    const first = el.querySelector('.haserr');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    toast('Periksa kembali data yang ditandai merah');
    return;
  }

  if(data.kk && data.peranKK === 'Kepala Keluarga' && DB.some(x => x.kk === data.kk && x.peranKK === 'Kepala Keluarga' && x.id !== editId)){
    toast('KK ini sudah memiliki kepala keluarga. Edit data kepala keluarga yang sudah ada terlebih dahulu.');
    return;
  }

  const now = new Date().toISOString();
  if(editId){
    const i = DB.findIndex(x=>x.id===editId);
    DB[i] = { ...DB[i], ...data, diubah: now };
    toast('Data warga diperbarui');
  } else {
    DB.push({ id: uid(), ...data, dibuat: now });
    toast('Data warga ditambahkan');
  }

  simpanDB();
  editId = null;
  prefillKK = '';
  go('warga');
}

/* =========================================================
   RENDER: STATISTIK
   ========================================================= */
function renderStat(){
  const el = document.getElementById('page-stat');
  const total = DB.length;

  if(total === 0){
    el.innerHTML = `<div class="empty"><div>📊</div>Belum ada data untuk dihitung.</div>`;
    return;
  }

  const L = DB.filter(d=>d.jk==='L').length;
  const P = DB.filter(d=>d.jk==='P').length;
  const kkCount = new Set(DB.map(d=>d.kk).filter(x=>x)).size;
  const umurArr = DB.map(d=>umur(d.tglLahir));
  const anak = umurArr.filter(u=>u!==null && u<=17).length;
  const lansia = umurArr.filter(u=>u!==null && u>=60).length;
  const umurTidakLengkap = umurArr.filter(u=>u===null).length;

  const grup = [
    {lb:'0–5 tahun', min:0, max:5}, {lb:'6–12 tahun', min:6, max:12},
    {lb:'13–17 tahun', min:13, max:17}, {lb:'18–25 tahun', min:18, max:25},
    {lb:'26–35 tahun', min:26, max:35}, {lb:'36–45 tahun', min:36, max:45},
    {lb:'46–55 tahun', min:46, max:55}, {lb:'56–65 tahun', min:56, max:65},
    {lb:'65+ tahun', min:66, max:999}
  ];

  const grupData = grup.map(g=>{
    const anggota = DB.map(d => ({ d, u: umur(d.tglLahir) }))
      .filter(x => x.u !== null && x.u >= g.min && x.u <= g.max)
      .sort((a,b) => (a.d.nama||'').localeCompare(b.d.nama||''));
    return { label: g.lb, min: g.min, max: g.max, anggota };
  });

  const hitung = k => {
    const m = {};
    DB.forEach(d=>{ const s = d[k] || 'Belum diisi'; m[s] = (m[s]||0)+1; });
    return m;
  };
  const keArr = (m, urutan) => {
    let keys = Object.keys(m);
    if(urutan) keys.sort((a,b)=>{
      const ia = urutan.indexOf(a), ib = urutan.indexOf(b);
      if(ia===-1 && ib===-1) return 0;
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia - ib;
    }); else keys.sort((a,b)=>m[b]-m[a]);
    return keys.map(k=>({label:k, value:m[k]}));
  };

  const kawinData = keArr(hitung('statusKawin'), STATUS_KAWIN);
  const didikData = keArr(hitung('pendidikan'), PENDIDIKAN);
  const hunianData = keArr(hitung('hunian'), HUNIAN);
  const agamaData = keArr(hitung('agama'), AGAMA);
  const kerjaData = keArr(hitung('pekerjaan')).slice(0,6);

  const persenL = Math.round(L/total*100);
  const persenP = 100 - persenL;

  el.innerHTML = `
    <div class="wilayah">
      <div class="wi">📊</div>
      <div class="wt">
        <b>${LABEL_WILAYAH}</b>
        <span>${total} jiwa · ${kkCount} KK</span>
      </div>
    </div>

    <div class="stat-summary">
      <div class="stat" style="cursor:default">
        <div class="lb">Total Penduduk</div>
        <div class="vl" style="color:#0f766e">${total}</div>
        <div class="sb">jiwa terdata</div>
      </div>
      <div class="stat" style="cursor:default">
        <div class="lb">Kepala Keluarga</div>
        <div class="vl" style="color:#2563eb">${kkCount}</div>
        <div class="sb">nomor KK unik</div>
      </div>
      <div class="stat" style="cursor:default">
        <div class="lb">Laki-laki</div>
        <div class="vl" style="color:#2563eb">${L}</div>
        <div class="sb">${persenL}% dari total</div>
      </div>
      <div class="stat" style="cursor:default">
        <div class="lb">Perempuan</div>
        <div class="vl" style="color:#db2777">${P}</div>
        <div class="sb">${persenP}% dari total</div>
      </div>
      <div class="stat" style="cursor:default">
        <div class="lb">Anak (0–17)</div>
        <div class="vl" style="color:#f59e0b">${anak}</div>
        <div class="sb">jiwa</div>
      </div>
      <div class="stat" style="cursor:default">
        <div class="lb">Lansia (60+)</div>
        <div class="vl" style="color:#7c3aed">${lansia}</div>
        <div class="sb">jiwa</div>
      </div>
    </div>

    <div class="section-title">Kelompok Umur</div>
    <div class="card">
      <div class="hint" style="margin-bottom:14px">Seluruh nama warga ditampilkan. Ketuk nama untuk detail.</div>
      ${kelompokUmurList(grupData, total)}
      ${umurTidakLengkap ? `<div class="hint" style="margin-top:14px">${umurTidakLengkap} data tanpa tanggal lahir valid tidak dihitung.</div>` : ''}
    </div>

    <div class="section-title">Status Perkawinan</div>
    <div class="card">${barList(kawinData, total)}</div>

    <div class="section-title">Pendidikan Terakhir</div>
    <div class="card">${barList(didikData, total)}</div>

    <div class="section-title">Pekerjaan Terbanyak</div>
    <div class="card">${barList(kerjaData, total)}</div>

    <div class="section-title">Status Hunian</div>
    <div class="card">${barList(hunianData, total)}</div>

    <div class="section-title">Agama</div>
    <div class="card">${barList(agamaData, total)}</div>

    <div class="foot">Statistik otomatis dari seluruh data warga ${LABEL_WILAYAH}</div>
  `;

  el.querySelectorAll('[data-pid]').forEach(b=>{
    b.addEventListener('click', ()=>bukaDetail(b.dataset.pid));
  });
}

function kelompokUmurList(data, total){
  if(!data.length) return `<div style="font-size:12.5px;color:#94a3b8">Belum ada data.</div>`;
  const max = Math.max(...data.map(g=>g.anggota.length), 1);

  return data.map(g=>{
    const jml = g.anggota.length;
    const pct = total ? Math.round(jml/total*100) : 0;
    const isi = jml === 0
      ? `<div class="ku-empty">Tidak ada warga di kelompok ini</div>`
      : `<div class="ku-names">
          ${g.anggota.map(({d,u})=>`
            <div class="ku-name" data-pid="${d.id}" title="Usia ${u} tahun">
              <span class="dot ${d.jk==='P'?'P':'L'}"></span>
              <span>${esc(d.nama||'(tanpa nama)')}</span>
            </div>`).join('')}
        </div>`;

    return `<div class="ku-group">
      <div class="ku-head">
        <span>${esc(g.label)}</span>
        <span class="ku-count">${jml} jiwa${jml?` (${pct}%)`:''}</span>
      </div>
      <div class="bar" style="margin:0 0 6px">
        <div class="track" style="height:6px">
          <div class="fill" style="width:${jml?Math.max(4,Math.round(jml/max*100)):0}%"></div>
        </div>
      </div>
      ${isi}
    </div>`;
  }).join('');
}

function barList(data, total){
  if(!data.length) return `<div style="font-size:12.5px;color:#94a3b8">Belum ada data.</div>`;
  const max = Math.max(...data.map(d=>d.value), 1);
  return data.map(d=>{
    const w = Math.round(d.value / max * 100);
    const pct = total ? Math.round(d.value/total*100) : 0;
    return `<div class="bar">
      <div class="bl"><span>${esc(d.label)}</span><span>${d.value} (${pct}%)</span></div>
      <div class="track"><div class="fill" style="width:${w}%"></div></div>
    </div>`;
  }).join('');
}

/* =========================================================
   EKSPOR / IMPOR
   ========================================================= */
const KOLOM = [
  ['nik','NIK'],['nama','Nama'],['jk','Jenis Kelamin'],['tglLahir','Tanggal Lahir'],
  ['kk','No KK'],['peranKK','Status dalam Keluarga'],['agama','Agama'],['statusKawin','Status Perkawinan'],
  ['pendidikan','Pendidikan'],['pekerjaan','Pekerjaan'],['alamat','Alamat'],
  ['rt','RT'],['rw','RW'],['hunian','Status Hunian'],['hp','No HP'],['catatan','Catatan']
];

function csvCell(v){
  let s = String(v==null?'':v);
  // Cegah formula injection saat CSV dibuka di aplikasi spreadsheet.
  if(/^[\s]*[=+@\-]/.test(s)) s = "'" + s;
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function unduh(namaFile, isi, mime){
  const blob = new Blob([isi], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = namaFile;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function eksporCSV(){
  const head = KOLOM.map(k=>k[1]).join(',');
  const body = DB.map(d => KOLOM.map(k=>csvCell(d[k[0]])).join(','));
  const csv = '\uFEFF' + [head, ...body].join('\r\n');
  const tgl = new Date().toISOString().slice(0,10);
  unduh('penduduk-rt03-rw02-babakansari-' + tgl + '.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV berhasil diunduh');
}

function eksporJSON(){
  const tgl = new Date().toISOString().slice(0,10);
  unduh('cadangan-rt03-rw02-babakansari-' + tgl + '.json',
    JSON.stringify(DB, null, 2), 'application/json');
  toast('Cadangan JSON berhasil diunduh');
}

function parseCSV(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  // Kenali CSV umum dari Excel: koma, titik koma, atau tab.
  const first = (text.split(/\r?\n/,1)[0] || '');
  const delimiter = [',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === delimiter){ row.push(cur); cur = ''; }
      else if(c === '\n'){ row.push(cur); cur=''; rows.push(row); row = []; }
      else if(c === '\r'){}
      else cur += c;
    }
  }
  if(q) throw new Error('CSV memiliki tanda kutip yang tidak berpasangan');
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0].trim() !== ''));
}

function normTgl(s){
  if(!s) return '';
  const t = String(s).trim();
  let y, m, d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)){ [y,m,d] = t.split('-').map(Number); }
  else {
    const a = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(!a) return '';
    // Format Indonesia: DD/MM/YYYY atau DD-MM-YYYY.
    d = Number(a[1]); m = Number(a[2]); y = Number(a[3]);
  }
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return '';
  return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function bersihkanObj(o){
  const jkRaw = String(o.jk||'').toUpperCase();
  let jk = 'L';
  if(jkRaw.startsWith('P') || jkRaw.includes('PEREMPUAN')) jk = 'P';
  return {
    nik: String(o.nik||'').replace(/\D/g,'').slice(0,16),
    kk: String(o.kk||'').replace(/\D/g,'').slice(0,16),
    nama: String(o.nama||'').trim(),
    jk, peranKK: String(o.peranKK||'').toLowerCase().includes('kepala') ? 'Kepala Keluarga' : 'Anggota',
    tglLahir: normTgl(o.tglLahir),
    agama: String(o.agama||'').trim(),
    statusKawin: String(o.statusKawin||'').trim(),
    pendidikan: String(o.pendidikan||'').trim(),
    pekerjaan: String(o.pekerjaan||'').trim(),
    alamat: String(o.alamat||'').trim(),
    rt: LOKASI.rt, rw: LOKASI.rw,
    hunian: String(o.hunian||'').trim(),
    hp: String(o.hp||'').trim(),
    catatan: String(o.catatan||'').trim()
  };
}

function tambahMassal(arr){
  let masuk = 0, lewat = 0;
  const now = new Date().toISOString();
  arr.forEach(raw=>{
    const d = bersihkanObj(raw);
    if(!d.nama || !/^\d{16}$/.test(d.nik) || (d.kk && !/^\d{16}$/.test(d.kk))){ lewat++; return; }
    if(DB.some(x=>x.nik === d.nik)){ lewat++; return; }
    DB.push({ id: uid(), ...d, dibuat: now });
    masuk++;
  });
  simpanDB();
  return { masuk, lewat };
}

function imporJSON(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('format JSON tidak valid'); }
  if(!Array.isArray(data)) throw new Error('JSON harus berupa daftar');
  if(!data.length) throw new Error('file kosong');
  const r = tambahMassal(data);
  toast(r.masuk + ' masuk, ' + r.lewat + ' dilewati');
  render();
}

function imporCSV(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('CSV kosong atau tidak valid');
  const normHead = h => String(h||'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[ _-]+/g,'');
  const head = rows[0].map(normHead);
  const aliases = {nik:['nik','nomorindukkependudukan'],nama:['nama','namalengkap'],jk:['jeniskelamin','jk','gender'],tglLahir:['tanggallahir','tgllahir','lahir'],kk:['nokk','nomorkk','kartukeluarga'],peranKK:['statusdalamkeluarga','perankk','statuskk']};
  const cari = names => head.findIndex(h => names.map(normHead).includes(h));
  const map = {};
  KOLOM.forEach(([key,label])=>{
    let i = cari([label,key,...(aliases[key]||[])]);
    if(i!==-1) map[key] = i;
  });
  if(map.nik === undefined || map.nama === undefined){
    throw new Error('kolom "NIK" dan "Nama" wajib ada');
  }
  const arr = rows.slice(1).map(r=>{
    const o = {};
    Object.keys(map).forEach(k=>{ o[k] = r[map[k]]; });
    return o;
  });
  const hasil = tambahMassal(arr);
  toast(hasil.masuk + ' masuk, ' + hasil.lewat + ' dilewati');
  render();
}
